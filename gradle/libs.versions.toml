[versions]
agp = "9.2.1"
kotlin = "2.1.21"
coreKtx = "1.15.0"
appcompat = "1.7.1"
coroutines = "1.11.0"
ksp = "2.1.21-2.0.2"
kogenDi = "1.0.8"
activityCompose = "1.9.3"
lifecycleViewmodel = "2.8.7"
koGenNavigation = "1.0.1"
navigation = "2.8.4"
